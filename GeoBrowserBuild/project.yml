name: GeoBrowser
options:
  bundleIdPrefix: com.example
targets:
  GeoBrowser:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - GeoBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.geobrowser
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GeoBrowser
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "GeoBrowser uses your location when a website requests it."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
