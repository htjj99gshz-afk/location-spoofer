name: Build Arabic IPA

# Arabic UI fork build. Any presentation-layer change rebuilds the unsigned IPA
# and refreshes the stable arabic-latest GitHub Release asset.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'App/**'
      - 'Shared/**'
      - 'Resources/**'
      - 'Scripts/apply-arabic-ui.py'
      - 'Scripts/arabic-ui-polish.py'
      - 'Scripts/arabic-ui-final.py'
      - 'project.yml'
      - 'build.sh'
      - '.github/workflows/build-arabic-ipa.yml'

jobs:
  build-arabic-ipa:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Apply Arabic UI and RTL
        run: python3 Scripts/apply-arabic-ui.py

      - name: Polish Arabic UI guides
        run: python3 Scripts/arabic-ui-polish.py

      - name: Final Arabic UI validation
        run: python3 Scripts/arabic-ui-final.py

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: ./build.sh

      - name: Prepare Arabic IPA
        run: |
          test -s dist/PaopaoLocationSpoofer-unsigned.ipa
          mv dist/PaopaoLocationSpoofer-unsigned.ipa dist/Location-Spoofer-Arabic-unsigned.ipa
          shasum -a 256 dist/Location-Spoofer-Arabic-unsigned.ipa | tee dist/SHA256.txt

      - name: Upload Arabic IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Location-Spoofer-Arabic-IPA
          path: |
            dist/Location-Spoofer-Arabic-unsigned.ipa
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="arabic-latest"
          TITLE="Location Spoofer — Arabic UI"
          NOTES_FILE="dist/RELEASE_NOTES.md"
          cat > "$NOTES_FILE" <<'EOF'
          # Location Spoofer — Arabic UI

          نسخة عربية غير موقعة من Location Spoofer، مبنية من هذا الـFork للاستخدام على الأجهزة المملوكة أو المصرح باختبارها.

          - واجهة عربية RTL.
          - إرشادات التفعيل والإلغاء عربية بالكامل.
          - مصطلحات بروكسي Wi‑Fi والشهادات محسّنة.
          - فحص البناء يمنع إصدار IPA إذا بقي نص صيني في String داخل App/ أو Shared/ أو Info.plist.
          - Bundle ID وApp Group والـEntitlements الأصلية محفوظة.

          الملف غير موقّع ويحتاج توقيعًا صالحًا قبل التثبيت على iPhone.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/Location-Spoofer-Arabic-unsigned.ipa \
              dist/SHA256.txt \
              --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              dist/Location-Spoofer-Arabic-unsigned.ipa \
              dist/SHA256.txt \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi
